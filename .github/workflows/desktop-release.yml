name: HomeCloud UI - Windows + Linux Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PRs build but never publish. Both merges and direct commits to main trigger
# a new release. Do not cancel an in-flight main release on the next commit.
concurrency:
  group: homecloud-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare - TypeScript and Vite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify frontend
        run: npm run build
      - name: Verify device type classification
        run: npm run test:devices
      - name: Verify HC Storage Service browser model
        run: npm run test:storage

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            bundles: nsis
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # The Tauri AppImage toolchain normally downloads from GitHub Releases
      # during bundling, where transient 504 responses have broken CI.
      - name: Restore cached Tauri packaging tools
        uses: actions/cache@v4
        with:
          path: src-tauri/target/.tauri
          key: homecloud-ui-tauri-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            homecloud-ui-tauri-tools-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential \
            curl wget file patchelf
      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Rust media room state and transport tests
        if: matrix.platform == 'linux-x64'
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Preload verified Tauri AppImage tools
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          tools='src-tauri/target/.tauri'
          mkdir -p "$tools"
          fetch_verified() {
            local path="$1" url="$2" expected="$3" tmp
            if [ -s "$path" ]; then
              if [[ "$path" == *AppRun-* ]]; then
                if echo "$expected  $path" | sha256sum --check --status; then return 0; fi
                rm -f "$path"
              else
                # Tauri patches the linuxdeploy executable in-place after use.
                return 0
              fi
            fi
            tmp="$(mktemp "${RUNNER_TEMP}/hc-ui-tool-XXXXXX")"
            if ! curl --fail --location --retry 10 --retry-all-errors --retry-delay 6 \
              --retry-max-time 900 --connect-timeout 20 --max-time 180 \
              --output "$tmp" "$url"; then
              rm -f "$tmp"
              return 1
            fi
            if ! echo "$expected  $tmp" | sha256sum --check --status; then
              rm -f "$tmp"
              echo "SHA-256 mismatch: $url" >&2
              return 1
            fi
            chmod 770 "$tmp"
            mv -f "$tmp" "$path"
          }
          fetch_verified "$tools/AppRun-x86_64" \
            'https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64' \
            'f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f'
          fetch_verified "$tools/linuxdeploy-07333c6-x86_64.AppImage" \
            'https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage' \
            '36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62'
          echo "Verified AppImage tools are ready"
      - name: Preload verified Windows NSIS tools
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path 'src-tauri/target' '.tauri'
          $nsis = Join-Path $tools 'NSIS'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          function Download-Verified([string]$Url, [string]$Output, [string]$Sha256) {
            $temp = "$Output.partial"
            try {
              & curl.exe --fail --location --retry 10 --retry-all-errors --retry-delay 6 --retry-max-time 900 --connect-timeout 20 --max-time 180 --output $temp $Url
              if ($LASTEXITCODE -ne 0) { throw "Download failed (curl exit $LASTEXITCODE): $Url" }
              $actual = (Get-FileHash -LiteralPath $temp -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $Sha256) { throw "SHA-256 mismatch for $Url" }
              Move-Item -LiteralPath $temp -Destination $Output -Force
            } finally { Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue }
          }
          $nsisExe = Join-Path $nsis 'NSIS.exe'
          if (!(Test-Path $nsisExe) -or (Get-FileHash -LiteralPath $nsisExe -Algorithm SHA1).Hash -ne '6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2') {
            $zip = Join-Path $env:RUNNER_TEMP 'hc-ui-nsis-3.13.zip'
            Download-Verified 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' $zip 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            Expand-Archive -LiteralPath $zip -DestinationPath $tools -Force
            if (Test-Path $nsis) { Remove-Item -LiteralPath $nsis -Recurse -Force }
            Move-Item -LiteralPath (Join-Path $tools 'nsis-3.13') -Destination $nsis
          }
          $plugin = Join-Path $nsis 'Plugins/x86-unicode/additional/nsis_tauri_utils.dll'
          $expectedPlugin = '5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709'
          if (!(Test-Path $plugin) -or (Get-FileHash -LiteralPath $plugin -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedPlugin) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $plugin) -Force | Out-Null
            Download-Verified 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $plugin $expectedPlugin
          }
          Write-Host 'Verified NSIS and Tauri plugin tools are ready.'
      - name: Build Tauri desktop packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            npm run tauri -- build --bundles "${{ matrix.bundles }}"
          else
            # Compile once; retry only packaging if an upstream download fails.
            npm run tauri -- build --no-bundle
            for attempt in 1 2 3 4 5; do
              if npm run tauri -- bundle --bundles "${{ matrix.bundles }}"; then
                exit 0
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Tauri packaging failed after five attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi

      - name: Collect Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $files = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction Stop)
          if ($files.Count -eq 0) { throw 'Windows NSIS installer missing' }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path release-assets $file.Name)
          }

      - name: Collect Linux packages
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if (( ${#debs[@]} == 0 || ${#appimages[@]} == 0 )); then
            echo "Missing .deb or .AppImage output" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp -- "${debs[@]}" "${appimages[@]}" release-assets/

      - name: Upload verified ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecloud-ui-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish both platforms to GitHub Releases
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download both platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: homecloud-ui-*
          path: release-assets
          merge-multiple: true
      - name: Verify artifacts and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          windows=(*.exe)
          linux_deb=(*.deb)
          linux_appimage=(*.AppImage)
          if (( ${#windows[@]} == 0 || ${#linux_deb[@]} == 0 || ${#linux_appimage[@]} == 0 )); then
            echo "Refusing partial release: Windows and both Linux bundles required" >&2
            exit 1
          fi
          sha256sum -- "${windows[@]}" "${linux_deb[@]}" "${linux_appimage[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update commit-scoped prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          tag="ui-$short"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "HomeCloud UI $short (Windows + Linux)" \
              --notes "Automated build from main commit $GITHUB_SHA. Windows x64: NSIS installer (.exe). Linux x64: .deb and .AppImage. Includes SHA256SUMS.txt. Development prerelease; Windows binary is not Authenticode-signed." \
              --prerelease
          fi
          gh release view "$tag" --json url --jq '.url'
